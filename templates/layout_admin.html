<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Oficina</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand font-monospace" href="{{ url_for('admin.dashboard') }}">🔧 Oficina - Gestão de Laudos</a>
            {% if current_user.is_authenticated %}
            <div>
                <a href="{{ url_for('admin.create_auth') }}" class="btn btn-success btn-sm me-2">+ Novo Laudo</a>
                <a href="{{ url_for('admin.logout') }}" class="btn btn-outline-danger btn-sm">Sair</a>
            </div>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                    <div class="alert alert-{{ category }}">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
